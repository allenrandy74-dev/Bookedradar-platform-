<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RadarTrust — BookedRadar</title><style>
:root{color-scheme:dark;--bg:#070b08;--panel:#101611;--line:#243226;--text:#f4f7f4;--muted:#9baa9d;--accent:#afff40}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px 18px}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:.17em;font-weight:800}.title{font-size:42px;font-weight:850;margin:8px 0}.muted{color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.controls input{background:#0d120e;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:9px}.controls button{background:var(--accent);border:0;border-radius:9px;padding:9px 12px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.full{grid-column:1/-1}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.yes{color:var(--accent)}.no{color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:1}}</style></head>
<body><main><div class="eyebrow">RADARTRUST</div><div class="title">What BookedRadar is allowed to do.</div><div class="muted">Permissions, safeguards and evidence of automation that was blocked or cancelled.</div>
<div class="controls"><input id="tenant" value="demo-hvac"><input id="token" type="password" placeholder="Admin token"><button id="load">Refresh</button></div><div id="status" class="muted"></div>
<div class="grid"><div class="card"><h3>Permissions</h3><div id="controls"></div></div><div class="card"><h3>Automation audit</h3><div id="audit"></div></div><div class="card full"><h3>Operating principle</h3><div id="principle" class="muted"></div></div></div></main>
<script>
const $=id=>document.getElementById(id);$("token").value=sessionStorage.getItem("br_admin_token")||"";$("tenant").value=sessionStorage.getItem("br_tenant")||$("tenant").value;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function row(k,v){const bool=typeof v==="boolean";return '<div class="row"><span>'+esc(k.replace(/([A-Z])/g," $1"))+'</span><b class="'+(bool?(v?"yes":"no"):"")+'">'+esc(bool?(v?"Enabled":"Disabled"):v)+'</b></div>'}
async function load(){const t=$("tenant").value.trim(),token=$("token").value.trim();sessionStorage.setItem("br_tenant",t);sessionStorage.setItem("br_admin_token",token);try{const r=await fetch("/api/v1/radartrust?tenant="+encodeURIComponent(t),{headers:token?{Authorization:"Bearer "+token}:{}});if(!r.ok)throw new Error();const {report}=await r.json();$("controls").innerHTML=Object.entries(report.controls||{}).map(([k,v])=>row(k,v)).join("");$("audit").innerHTML=Object.entries(report.actionAudit||{}).filter(([k,v])=>typeof v!=="object").map(([k,v])=>row(k,v)).join("");$("principle").textContent=report.principle;$("status").textContent="Live"}catch{$("status").textContent="Unavailable"}}$("load").onclick=load;load();
</script></body></html>
