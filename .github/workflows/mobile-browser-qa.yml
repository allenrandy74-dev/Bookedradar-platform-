name: Remaining mobile browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/mobile-browser/**'
      - '.github/workflows/mobile-browser-qa.yml'

permissions:
  contents: read

concurrency:
  group: mobile-browser-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mobile-browser:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'qa/mobile-gaps-20261003'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
      - name: Verify test-only changes and exact source
        run: node qa/mobile-browser/verify-source.mjs
      - name: Existing source-level form and reporting checks
        run: node --test test/pilot-signup-ui.test.js test/audit-capture-ui.test.js test/customer-results-requests.test.js > qa/mobile-browser/evidence/unit-tests.tap
      - name: Install existing pinned QA dependency lock without scripts or cache
        working-directory: qa/reporting-browser
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify lock and test syntax
        run: |
          git diff --exit-code -- qa/reporting-browser/package-lock.json
          for file in qa/mobile-browser/*.mjs; do node --check "$file"; done
      - name: Pull pinned official browser image
        run: |
          docker pull mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          docker image inspect mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 --format '{{json .RepoDigests}}' > qa/mobile-browser/evidence/browser-image.json
      - name: Run synthetic mobile QA without external network
        env:
          QA_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm --network none --cap-drop ALL --shm-size=256m --user "$(id -u):$(id -g)" \
            -e CI=true -e QA_COMMIT \
            -v "$GITHUB_WORKSPACE:/work" -w /work/qa/mobile-browser \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            node ../reporting-browser/node_modules/playwright/cli.js test --config playwright.config.mjs
      - name: Package lossless evidence within single-upload cap
        if: always()
        id: evidence
        run: python3 qa/mobile-browser/package-evidence.py
      # Disabled for diagnostics. Before one authorized upload, gate this to the
      # exact approved PR, workflow run number and first attempt. No automatic retry.
      - name: Upload one approved proof only
        if: ${{ false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-browser-${{ github.event.pull_request.head.sha }}
          path: qa/mobile-browser/mobile-proof.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
