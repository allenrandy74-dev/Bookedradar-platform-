name: Reporting browser QA

on:
  pull_request:
    # Temporary stacked review target; remove after PR108 lands and this PR is retargeted.
    branches: [main, fix/public-intake-chat-accessibility-20261013]
    paths:
      # Include reporting pages and their backend/shared dependencies.
      - 'public/signup.html'
      - 'public/pilot-signup.js'
      - 'public/bookedradar-chat.js'
      - 'website/src/demo-chat.js'
      - 'website/src/demo-chat.html'
      - 'public/owner-brief.html'
      - 'public/radarproof-dashboard.html'
      - 'server.js'
      - 'startup.mjs'
      - 'scripts/**'
      - 'src/**'
      - 'config/**'
      - 'db/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'qa/reporting-browser/**'
      - '.github/workflows/reporting-browser-qa.yml'

permissions:
  contents: read

concurrency:
  group: reporting-browser-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reporting-browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - name: Verify current source provenance
        env:
          QA_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: node qa/reporting-browser/verify-source.mjs
      - name: Install existing dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Combined syntax checks
        run: npm run check
      - name: Reporting, request-state and provenance regressions
        run: node --test test/customer-results-acceptance.test.js test/customer-results-requests.test.js qa/reporting-browser/verify-source.test.mjs qa/reporting-browser/public-network-policy.test.mjs
      - name: Combined ordinary suite
        run: npm test
      - name: Combined deterministic simulation
        run: npm run simulate
        env:
          SIM_SCENARIOS: '200'
      - name: Install exact official Playwright package without lifecycle scripts
        working-directory: qa/reporting-browser
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify and preserve committed QA dependency lock
        run: |
          git diff --exit-code -- qa/reporting-browser/package-lock.json
          echo QA_PACKAGE_LOCK_BEGIN
          cat qa/reporting-browser/package-lock.json
          echo QA_PACKAGE_LOCK_END
          cp qa/reporting-browser/package-lock.json qa/reporting-browser/evidence/qa-package-lock.json
      - name: Check QA harness syntax
        run: |
          for file in qa/reporting-browser/*.mjs qa/reporting-browser/tests/*.mjs; do node --check "$file"; done
      - name: Pull pinned official browser image
        run: |
          docker pull mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          docker image inspect mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 --format '{{json .RepoDigests}}' > qa/reporting-browser/evidence/browser-image.json
      - name: Browser tests with no external network interface
        env:
          QA_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm --network none --cap-drop ALL --shm-size=256m --user "$(id -u):$(id -g)" \
            -e CI=true -e QA_COMMIT \
            -v "$GITHUB_WORKSPACE:/work" -w /work/qa/reporting-browser \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 npm test
      - name: Package only the historically authorized proof
        if: ${{ always() && github.event.pull_request.number == 94 && github.run_number == 7 && github.run_attempt == 1 }}
        id: evidence
        run: python3 qa/reporting-browser/package-evidence.py
      # One owner-authorized acceptance upload only: PR94, workflow run 7, first attempt; preserve the prior artifact.
      # Future runs and retries cannot create additional paid storage.
      - name: Upload one authorized final contrast proof
        if: ${{ success() && steps.evidence.outputs.ready == 'true' && github.event.pull_request.number == 94 && github.run_number == 7 && github.run_attempt == 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reporting-browser-${{ github.event.pull_request.head.sha }}
          path: qa/reporting-browser/final-proof.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
