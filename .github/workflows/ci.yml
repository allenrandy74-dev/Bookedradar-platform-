name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, world-class-ops-2026-09-28]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: SIM_SCENARIOS=200 npm run simulate
