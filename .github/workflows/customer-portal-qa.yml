name: Customer portal isolated QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'customer-portal/**'
      - '.github/workflows/customer-portal-qa.yml'
permissions:
  contents: read
jobs:
  isolated-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and synthetic API/model tests
        run: npm run check --prefix customer-portal && npm test --prefix customer-portal
      - name: Install the existing pinned browser QA toolchain
        run: npm ci --prefix qa/reporting-browser
      - name: Install isolated Chromium
        working-directory: qa/reporting-browser
        run: npx playwright install --with-deps chromium
      - name: Exercise synthetic portal in browser
        run: node customer-portal/qa/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-portal-browser-evidence
          path: customer-portal/qa/evidence/
          if-no-files-found: warn
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: bookedradar_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d bookedradar_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Verify tenant, session, concurrency and audit on disposable Postgres
        run: npm run test:postgres --prefix customer-portal
        env:
          PORTAL_TEST_DATABASE_URL: postgresql://test_user:disposable_ci_only@127.0.0.1:5432/bookedradar_portal_test
          PORTAL_TEST_ACK: disposable
