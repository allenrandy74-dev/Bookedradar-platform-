name: Mobile app sample review

on:
  pull_request:
    branches: [codex/mobile-review-base-20261013]
    types: [opened, synchronize, reopened]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-app-review.yml'

permissions:
  contents: read

concurrency:
  group: mobile-app-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sample-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/mobile-sample-review-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile-app
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install locked sample-app dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, lint, domain and React Native component tests
        run: npm run check
      - name: Export iOS Hermes JavaScript bundle (not an IPA)
        run: npm run export:ios
      - name: Export Android Hermes JavaScript bundle (not an APK)
        run: npm run export:android
      - name: Export browser preview
        run: npm run export:web
      - name: Install official Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Phone-viewport browser screenshots and interaction tests
        run: npm run test:browser -- --workers=1
      - name: Preserve browser-rendered review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-browser-review-${{ github.event.pull_request.head.sha }}
          path: |
            mobile-app/test-results/**
            mobile-app/qa/browser-report/**
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 6
